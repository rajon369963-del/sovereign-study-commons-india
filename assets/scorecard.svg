  <!-- Metric 1 -->
  <g transform="translate(40, 115)">
    <rect width="250" height="130" rx="12" fill="#0f2744" stroke="#1e3a5f"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Oracle Adversarial Tests</text>
    <text x="20" y="75" fill="#34d399" font-family="monospace" font-size="34" font-weight="800">24 / 24</text>
    <text x="20" y="105" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">✓ 0 Errors (CI-V1-001..024)</text>
  </g>

