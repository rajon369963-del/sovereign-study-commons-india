  </defs>
  <rect width="900" height="320" rx="16" fill="url(#study-bg)" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="20" y="20" width="860" height="4" fill="url(#emerald-grad)" rx="2"/>
  
  <text x="40" y="55" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SOVEREIGN STUDY COMMONS INDIA • EVIDENCE VERIFICATION SCORECARD</text>
