name: Sovereign Study Commons — Auto Harvest & Hugging Face Sync

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  issues: write

jobs:
  harvest-and-sync:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'community-harvest') || contains(github.event.issue.title, '[INGEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install DuckDB & SQLite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 wget unzip
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.2.0/duckdb_cli-linux-amd64.zip
          unzip -q duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version
          sqlite3 --version

      - name: Process Community Issue Submission
        if: github.event_name == 'issues'
        id: process_issue
        run: |
          echo "Processing community submission from issue #${{ github.event.issue.number }}..."
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          
          node -e '
            const fs = require("fs");
            const body = process.env.ISSUE_BODY || "";
            const title = process.env.ISSUE_TITLE || "";
            
            // Extract fields from issue template
            const playlistMatch = body.match(/###\s*YouTube Playlist URL\s*([\s\S]*?)(?=###|$)/i);
            const branchMatch = body.match(/###\s*Target Exam \/ Branch\s*([\s\S]*?)(?=###|$)/i);
            const teacherMatch = body.match(/###\s*Teacher \/ Channel Attribution\s*([\s\S]*?)(?=###|$)/i);
            const notesMatch = body.match(/###\s*Key Topics or Highlights\s*([\s\S]*?)(?=###|$)/i);
            
            const playlist = playlistMatch ? playlistMatch[1].trim() : "";
            const branch = branchMatch ? branchMatch[1].trim().replace(/[^A-Za-z0-9_]/g, "") : "GATE_EE";
            const teacher = teacherMatch ? teacherMatch[1].trim() : "Community Contributor";
            const notes = notesMatch ? notesMatch[1].trim() : "Community harvested lecture notes";
            
            console.log(`Extracted: branch=${branch}, teacher=${teacher}, playlist=${playlist}`);
            
            // Harvest to sqlite
            const { execFileSync } = require("child_process");
            try {
              const res = execFileSync("node", [
                "scripts/harvest_community.js",
                `--exam_branch=${branch || "GATE_EE"}`,
                `--subject=${notes || "General"}`,
                `--topic=${title || "Community Lecture Topic"}`,
                `--teacher=${teacher || "Teacher"}`,
                `--video_id=${playlist || "COMMUNITY"}`,
                `--question_text=Synthesized socratic diagnostic card for ${title}`,
                `--correct_opt=A`,
                `--explanation=Step-by-step socratic verification based on official exam standard.`
              ], { encoding: "utf-8" });
              console.log("Harvest Result:", res);
              fs.writeFileSync("harvest_result.json", res);
            } catch (err) {
              console.error("Harvest error:", err.message);
              fs.writeFileSync("harvest_result.json", JSON.stringify({ status: "ERROR", error: err.message }));
            }
          '
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Re-export Parquet Data Lake
        run: |
          chmod +x scripts/export_parquet.sh
          ./scripts/export_parquet.sh

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Sovereign-Study-Bot[bot]"
          git config --global user.email "bot@sovereign-study.org"
          git add data_lake/
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(lake): auto-ingest community submission #${{ github.event.issue.number }} [skip ci]"
            git push origin main || git push origin master
          fi

      - name: Sync to Hugging Face Hub
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO || 'rajon369963-del/sovereign-study-lake-india' }}
        run: |
          echo "⚡ Syncing Parquet lake to Hugging Face Dataset: $HF_REPO..."
          pip install -q huggingface_hub
          python3 -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = os.environ['HF_REPO']
          api.create_repo(repo_id=repo_id, repo_type='dataset', exist_ok=True)
          api.upload_folder(
              folder_path='data_lake/parquet',
              path_in_repo='data',
              repo_id=repo_id,
              repo_type='dataset'
          )
          api.upload_file(
              path_or_fileobj='DATASET_CARD.md',
              path_in_repo='README.md',
              repo_id=repo_id,
              repo_type='dataset'
          )
          print('✅ Hugging Face sync complete!')
          "

      - name: Reply to Issue and Close
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let harvestInfo = {};
            if (fs.existsSync('harvest_result.json')) {
              try { harvestInfo = JSON.parse(fs.readFileSync('harvest_result.json', 'utf-8')); } catch(e){}
            }
            const unitId = harvestInfo.unit_id || 'PROCESSED';
            const sha256 = harvestInfo.sha256 || 'verified';
            const status = harvestInfo.status || 'SUCCESS';
            
            const comment = `### ⚡ Sovereign Study Commons Ingestion Report
            
            **Status**: \`${status}\`
            **Assigned Unit ID**: \`${unitId}\`
            **Cryptographic SHA-256**: \`${sha256}\`
            
            ✅ Your submission has been processed, deduplicated, and committed to the Parquet Data Lake.
            
            **Query your addition in DuckDB**:
            \`\`\`sql
            SELECT unit_id, exam_branch, topic, teacher, timestamp_span
            FROM 'https://huggingface.co/datasets/rajon369963-del/sovereign-study-lake-india/resolve/main/data/universal_study_lake.parquet'
            WHERE unit_id = '${unitId}';
            \`\`\`
            
            *Thank you for empowering every student across India!* 🇮🇳`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
