name: Data integrity

on:
  pull_request:
    paths:
      - 'data_lake/**'
      - 'scripts/repair_fts_sync.py'
      - '.github/workflows/data-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data_lake/**'
      - 'scripts/repair_fts_sync.py'
      - '.github/workflows/data-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-data-lake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned DuckDB
        run: python -m pip install --disable-pip-version-check --no-input duckdb==1.5.5

      - name: Verify SQLite and Parquet integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import sqlite3
          from pathlib import Path

          import duckdb

          root = Path('data_lake')
          sqlite_files = sorted((root / 'sqlite').glob('*.sqlite'))
          parquet_files = sorted((root / 'parquet').glob('*.parquet'))
          assert sqlite_files, 'no SQLite files found'
          assert parquet_files, 'no Parquet files found'

          report = {'sqlite': [], 'parquet': []}

          # Repository-specific intended membership contracts. These are explicit on
          # purpose: a green build must not infer away an unexplained source/index gap.
          expected_fts_sources = {
              'universal_fts': 'study_units',
          }

          def qident(name):
              return '"' + name.replace('"', '""') + '"'

          def bounded_metadata(con, table, rowids):
              """Return only provenance/key metadata for drifted rows, never study text."""
              cols = [r[1] for r in con.execute(f'PRAGMA table_info({qident(table)})')]
              allowed_tokens = ('id', 'hash', 'sha', 'source', 'license', 'status', 'index', 'include', 'exclude', 'type')
              safe_cols = [c for c in cols if any(tok in c.lower() for tok in allowed_tokens)][:12]
              if not safe_cols:
                  return [{'rowid': rid} for rid in rowids[:20]]
              projection = ', '.join(qident(c) for c in safe_cols)
              out = []
              for rid in rowids[:20]:
                  row = con.execute(
                      f'SELECT {projection} FROM {qident(table)} WHERE rowid=?', (rid,)
                  ).fetchone()
                  item = {'rowid': rid}
                  if row is not None:
                      item.update(dict(zip(safe_cols, row)))
                  out.append(item)
              return out

          for path in sqlite_files:
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as con:
                  integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
                  assert integrity == 'ok', f'{path}: integrity_check={integrity!r}'

                  objects = {
                      r[0]: {'type': r[1], 'sql': r[2] or ''}
                      for r in con.execute(
                          "SELECT name, type, sql FROM sqlite_master "
                          "WHERE name NOT LIKE 'sqlite_%' ORDER BY name"
                      )
                  }
                  tables = sorted(name for name, meta in objects.items() if meta['type'] == 'table')
                  assert tables, f'{path}: no user tables'
                  row_counts = {
                      t: con.execute(f'SELECT COUNT(*) FROM {qident(t)}').fetchone()[0]
                      for t in tables
                  }

                  # Fail closed on duplicate identity/provenance keys where present.
                  for table in tables:
                      cols = {r[1] for r in con.execute(f'PRAGMA table_info({qident(table)})')}
                      for key in ('unit_id', 'sha256_hash'):
                          if key in cols:
                              total, nonnull, distinct = con.execute(
                                  f'SELECT COUNT(*), COUNT({qident(key)}), '
                                  f'COUNT(DISTINCT {qident(key)}) FROM {qident(table)}'
                              ).fetchone()
                              assert total == nonnull == distinct, (
                                  f'{path}:{table}: {key} must be non-null and unique; '
                                  f'total={total}, nonnull={nonnull}, distinct={distinct}'
                              )

                  # Fail closed on unexplained FTS5 membership drift. Physical SQLite
                  # integrity is not enough: the search index must represent the intended
                  # source-table membership, not merely be internally self-consistent.
                  fts_contracts = []
                  fts_tables = sorted(
                      name for name, meta in objects.items()
                      if meta['type'] == 'table'
                      and 'VIRTUAL TABLE' in meta['sql'].upper()
                      and 'USING FTS5' in meta['sql'].upper()
                  )

                  for fts in fts_tables:
                      create_sql = objects[fts]['sql']
                      match = re.search(r"\bcontent\s*=\s*['\"]([^'\"]+)['\"]", create_sql, re.I)
                      source = expected_fts_sources.get(fts)
                      if not source:
                          source = match.group(1) if match else None
                      if not source and fts.endswith('_fts') and fts[:-4] in objects:
                          source = fts[:-4]

                      shadow_content = f'{fts}_content'
                      shadow_docsize = f'{fts}_docsize'
                      contract = {'fts': fts, 'source': source}

                      assert source, f'{path}:{fts}: no intended source-table contract'
                      assert source in objects and objects[source]['type'] == 'table', (
                          f'{path}:{fts}: intended source table {source!r} is missing'
                      )

                      source_ids = {
                          r[0] for r in con.execute(f'SELECT rowid FROM {qident(source)}')
                      }
                      source_count = len(source_ids)
                      assert source_count == row_counts[source], (
                          f'{path}:{source}: duplicate/collision in rowid accounting'
                      )
                      contract['source_rows'] = source_count

                      indexed_ids = None
                      if shadow_content in objects:
                          content_ids = [
                              r[0] for r in con.execute(
                                  f'SELECT id FROM {qident(shadow_content)}'
                              )
                          ]
                          assert len(content_ids) == len(set(content_ids)), (
                              f'{path}:{shadow_content}: duplicate FTS content ids'
                          )
                          indexed_ids = set(content_ids)
                          contract['fts_content_rows'] = len(content_ids)
                      elif shadow_docsize in objects:
                          docsize_ids = [
                              r[0] for r in con.execute(
                                  f'SELECT id FROM {qident(shadow_docsize)}'
                              )
                          ]
                          assert len(docsize_ids) == len(set(docsize_ids)), (
                              f'{path}:{shadow_docsize}: duplicate FTS doc ids'
                          )
                          indexed_ids = set(docsize_ids)
                          contract['fts_docsize_rows'] = len(docsize_ids)

                      assert indexed_ids is not None, (
                          f'{path}:{fts}: cannot prove indexed membership; '
                          'no auditable FTS content/docsize id set found'
                      )
                      missing = sorted(source_ids - indexed_ids)
                      extra = sorted(indexed_ids - source_ids)
                      contract['missing_source_rowids'] = missing[:20]
                      contract['extra_index_rowids'] = extra[:20]
                      if missing:
                          contract['missing_source_metadata'] = bounded_metadata(con, source, missing)
                      if missing or extra:
                          print(json.dumps({'fts_membership_drift': contract}, indent=2, sort_keys=True))
                      assert not missing and not extra, (
                          f'{path}:{fts}: unexplained FTS membership drift versus {source}; '
                          f'missing_source_rowids={missing[:20]}, extra_index_rowids={extra[:20]}'
                      )

                      if shadow_content in objects and shadow_docsize in objects:
                          content_ids = {
                              r[0] for r in con.execute(
                                  f'SELECT id FROM {qident(shadow_content)}'
                              )
                          }
                          docsize_ids = {
                              r[0] for r in con.execute(
                                  f'SELECT id FROM {qident(shadow_docsize)}'
                              )
                          }
                          assert content_ids == docsize_ids, (
                              f'{path}:{fts}: FTS shadow content/docsize membership differs'
                          )

                      fts_contracts.append(contract)

                  assert fts_tables, f'{path}: no FTS5 virtual table found; expected search index missing'
                  unknown_contracts = sorted(set(expected_fts_sources) - set(fts_tables))
                  assert not unknown_contracts, (
                      f'{path}: expected FTS tables missing: {unknown_contracts}'
                  )

              report['sqlite'].append({
                  'path': str(path),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'tables': row_counts,
                  'fts_membership_contracts': fts_contracts,
              })

          con = duckdb.connect(database=':memory:')
          for path in parquet_files:
              quoted = str(path).replace("'", "''")
              row_count = con.execute(f"SELECT COUNT(*) FROM read_parquet('{quoted}')").fetchone()[0]
              assert row_count > 0, f'{path}: zero rows'
              schema = con.execute(f"DESCRIBE SELECT * FROM read_parquet('{quoted}')").fetchall()
              assert schema, f'{path}: empty schema'
              report['parquet'].append({
                  'path': str(path),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'rows': row_count,
                  'columns': [r[0] for r in schema],
              })

          print(json.dumps(report, indent=2, sort_keys=True))
          PY

  prove-r119-repair-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prove repair on isolated database copy
        shell: bash
        run: |
          set -euo pipefail
          cp data_lake/sqlite/universal_study_lake.sqlite /tmp/universal_study_lake.sqlite
          python scripts/repair_fts_sync.py /tmp/universal_study_lake.sqlite | tee /tmp/r119-repair-report.json
          gzip -n -c /tmp/universal_study_lake.sqlite > /tmp/universal_study_lake.sqlite.gz
          sha256sum /tmp/universal_study_lake.sqlite /tmp/universal_study_lake.sqlite.gz /tmp/r119-repair-report.json

      - name: Upload short-lived repaired candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r119-repaired-sqlite-${{ github.sha }}
          path: |
            /tmp/universal_study_lake.sqlite.gz
            /tmp/r119-repair-report.json
          if-no-files-found: error
          retention-days: 1
