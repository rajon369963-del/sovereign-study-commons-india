name: Pages endpoint smoke

on:
  pull_request:
    paths:
      - '.github/workflows/pages-endpoint-smoke.yml'
      - 'scripts/verify_pages_endpoint.sh'
      - 'tests/test_pages_endpoint_gate.py'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify endpoint oracle fixtures
        shell: bash
        run: python3 tests/test_pages_endpoint_gate.py
      - name: Verify unauthenticated Pages endpoint
        shell: bash
        run: bash scripts/verify_pages_endpoint.sh
