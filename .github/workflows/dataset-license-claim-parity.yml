name: Dataset license claim parity

on:
  pull_request:
    paths:
      - 'DATASET_CARD.md'
      - 'data_lake/dataset_manifest.json'
      - 'scripts/verify_dataset_license_claims.py'
      - 'scripts/test_dataset_license_claim_parity.py'
      - '.github/workflows/dataset-license-claim-parity.yml'
  push:
    branches: [main]
    paths:
      - 'DATASET_CARD.md'
      - 'data_lake/dataset_manifest.json'
      - 'scripts/verify_dataset_license_claims.py'
      - 'scripts/test_dataset_license_claim_parity.py'
      - '.github/workflows/dataset-license-claim-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-license-claim-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-claim-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify committed dataset-card vs manifest rights state
        run: python3 scripts/verify_dataset_license_claims.py

      - name: Run hostile mixed-rights negative fixtures
        working-directory: scripts
        run: python3 test_dataset_license_claim_parity.py
