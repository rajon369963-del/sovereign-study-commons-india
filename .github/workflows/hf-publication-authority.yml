name: HF publication authority

on:
  pull_request:
    paths:
      - 'workflows_template/auto_harvest_and_hf_sync.yml'
      - 'scripts/hf_publication_authority.py'
      - 'scripts/test_hf_publication_authority.py'
      - '.github/workflows/hf-publication-authority.yml'
  push:
    branches: [main]
    paths:
      - 'workflows_template/auto_harvest_and_hf_sync.yml'
      - 'scripts/hf_publication_authority.py'
      - 'scripts/test_hf_publication_authority.py'
      - '.github/workflows/hf-publication-authority.yml'

permissions:
  contents: read

jobs:
  authority-court:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Show checked-out object
        run: git rev-parse HEAD
      - name: Run Hugging Face publication-authority courts
        run: |
          python3 scripts/test_hf_publication_authority.py
      - name: Verify staged workflow uses typed remote evidence
        run: |
          grep -q 'scripts/hf_publication_authority.py' workflows_template/auto_harvest_and_hf_sync.yml
          grep -q 'remote_unit_queryable' workflows_template/auto_harvest_and_hf_sync.yml
          if grep -q "Query your addition in DuckDB" workflows_template/auto_harvest_and_hf_sync.yml; then
            echo 'stale remote-queryability claim still present' >&2
            exit 1
          fi
