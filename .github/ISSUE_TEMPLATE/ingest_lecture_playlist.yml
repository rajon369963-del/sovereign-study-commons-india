name: 📥 Propose Lecture Playlist / Video for Review
description: Submit a public educational YouTube playlist or video for maintainer review; submission does not trigger automatic ingestion.
title: "[INGEST-REQUEST]: "
labels: ["community-harvest", "zero-duplicate-check"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🌐 Study Commons ingestion candidate
        Thank you for contributing. This form creates a review request only.

        **Current truth:** submission does **not** automatically run C17 cleaning, deduplication, transcript extraction, or Hugging Face publishing. A maintainer must review source suitability, licensing/provenance, duplication risk, and the currently verified ingestion path before any data is added.

        If automated ingestion is introduced later, it must first be present on the default branch, pass its acceptance/security/provenance checks, and be documented as verified before this form promises automation.

  - type: input
    id: playlist_url
    attributes:
      label: YouTube Playlist or Video URL
      description: Enter the public source URL to be reviewed.
      placeholder: https://www.youtube.com/playlist?list=PL...
    validations:
      required: true

  - type: dropdown
    id: exam_branch
    attributes:
      label: Target Exam & Branch
      description: Select the closest current Study Commons category.
      options:
        - "GATE_EE (Electrical Engineering)"
        - "UPSC_CSE (Civil Services / Polity / General Studies)"
        - "NEET_UG (Medical Entrance / Biology)"
        - "STATE_AE_JE (Assistant / Junior Engineer / PSUs)"
        - "GENERAL_STEM (Other STEM / Physics / Math)"
    validations:
      required: true

  - type: input
    id: teacher_attribution
    attributes:
      label: Primary Teacher / Channel Name
      description: Name of the educator or channel so provenance can be reviewed.
      placeholder: e.g. NPTEL
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I confirm this is a public educational source and understand this submission is a review request, not a promise of ingestion or republication.
          required: true
